<!DOCTYPE html>
<html>
<head>
  <title>Random Number Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    #number {
      font-size: 48px;
      color: #333;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Random Number Generator</h1>
  <div id="number">?</div>
  <button onclick="generateRandom()">Generate</button>

  <script>
    function generateRandom() {
      const randomNumber = Math.floor(Math.random() * 100) + 1;
      document.getElementById('number').textContent = randomNumber;
    }

    // Generate a random number on page load
    window.onload = generateRandom;
  </script>

</body>
</html>
